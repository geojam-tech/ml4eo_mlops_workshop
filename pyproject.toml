[project]
name = "ml4eo"
version = "0.1.0"
description = "ML4EO Workshop — MLOps for Earth Observation"
requires-python = ">=3.11"
dependencies = [
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2023.1",
    "shapely>=2.0",
    "pyproj>=3.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "prefect>=3.0,<4.0",
    "sqlite-utils>=3.35",
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "pyarrow>=14.0",
    "mlflow>=3.14.0",
    "gdown>=6.1.0",
]
